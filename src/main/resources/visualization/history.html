<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Graph transformation history</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #0b121b;
            --panel: #121e2b;
            --border: #293b4e;
            --text: #e5edf6;
            --muted: #9aafc4;
            --accent: #75e1ca;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 90px; }
        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font: 15px/1.6 system-ui, sans-serif;
        }
        header, main, nav { max-width: 1900px; margin: auto; }
        header { padding: 48px 28px 24px; }
        .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: .15em; }
        h1 { margin: 8px 0; font-size: clamp(26px, 4vw, 42px); line-height: 1.2; }
        h2, h3, h4 { margin: 0; }
        p { color: var(--muted); margin: 8px 0; }
        nav {
            display: flex; gap: 8px; overflow-x: auto; padding: 14px 28px;
            position: sticky; top: 0; z-index: 2;
            background: var(--background); border-bottom: 1px solid var(--border);
        }
        a, button {
            color: var(--text); background: var(--panel);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 7px 12px; font: inherit; text-decoration: none;
            cursor: pointer; white-space: nowrap;
        }
        a:hover, button:hover { border-color: var(--accent); color: var(--accent); }
        a:focus-visible, button:focus-visible, summary:focus-visible {
            outline: 2px solid var(--accent); outline-offset: 3px;
        }
        main { padding: 24px 28px 64px; }
        .step {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 16px; padding: 24px; margin-bottom: 28px;
        }
        .step-heading { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
        .number {
            display: grid; place-items: center; width: 38px; height: 38px;
            flex-shrink: 0; background: #203d41; color: var(--accent); border-radius: 10px;
        }
        .graph-view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
        .graph-pane, .matrix-pane { min-width: 0; }
        .graph-frame {
            background: #0e1823; border: 1px solid var(--border);
            border-radius: 12px; position: relative; overflow: hidden;
        }
        .graph-frame svg { display: block; width: 100%; height: 1000px; }
        .graph-frame svg { cursor: grab; touch-action: none; }
        .graph-frame svg.dragging { cursor: grabbing; }
        .toolbar { display: flex; gap: 4px; padding: 8px; position: absolute; right: 0; top: 0; }
        .toolbar button { padding: 3px 10px; font-size: 13px; }
        .toolbar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
        .grid-line { stroke: #243647; stroke-width: 1; }
        .grid-axis { stroke: #607991; stroke-width: 1.5; }
        .grid-tick { fill: #9aafc4; font-size: 11px; }
        .edge { fill: none; stroke: #7692ac; stroke-width: 1.7; }
        .edge-label {
            fill: #becddd; font-size: 11px; text-anchor: middle;
            paint-order: stroke; stroke: #0e1823; stroke-width: 4px; stroke-linejoin: round;
        }
        .node { fill: #193d47; stroke: var(--accent); stroke-width: 1.8; }
        .node-label { fill: #f0fffb; font-size: 13px; text-anchor: middle; }
        .node-id { fill: #b4c6d8; font-size: 11px; text-anchor: middle; }
        .matrix-scroll {
            height: 560px;
            overflow: scroll;
            scrollbar-gutter: stable;
            scrollbar-width: auto;
            scrollbar-color: var(--accent) #1c2b3b;
            border: 1px solid var(--border);
            border-radius: 10px;
        }
        .matrix-scroll::-webkit-scrollbar { width: 14px; height: 14px; }
        .matrix-scroll::-webkit-scrollbar-track { background: #1c2b3b; }
        .matrix-scroll::-webkit-scrollbar-thumb {
            background: var(--accent);
            border: 3px solid #1c2b3b;
            border-radius: 8px;
        }
        .matrix-scroll::-webkit-scrollbar-corner { background: #1c2b3b; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
        th, td { padding: 10px 12px; text-align: center; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        th { background: #1c2b3b; white-space: nowrap; }
        thead th { position: sticky; top: 0; z-index: 1; }
        tbody th { position: sticky; left: 0; }
        td { min-width: 140px; }
        td.empty { color: #60758a; }
        .connection { white-space: nowrap; }
        .matrix-pane h3, .graph-pane h3 { margin-bottom: 8px; font-size: 14px; }
        .hint { font-size: 12px; }
        details { margin-top: 20px; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
        summary { cursor: pointer; color: var(--accent); font-weight: 600; }
        .matrix-details { margin-top: 0; }
        .matrix-details[open] { padding-bottom: 16px; }
        .matrix-details > .matrix-pane { margin-top: 14px; }
        .applied-production[open] > summary { margin-bottom: 14px; }
        .production-sides { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 16px; }
        .production-sides .graph-view { grid-template-columns: minmax(0, 1fr); }
        .production-sides svg { height: 720px; }
        .production-sides .matrix-scroll { height: 560px; }
        .production-sides h4 { margin-bottom: 10px; }
        .rules { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 16px; }
        .rules ul { padding-left: 20px; color: var(--muted); }
        @media (max-width: 1000px) {
            .graph-view, .production-sides { grid-template-columns: minmax(0, 1fr); }
            header, main { padding-left: 16px; padding-right: 16px; }
            .step { padding: 16px; }
        }
        @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    </style>
</head>
<body>
    <header>
        <div class="eyebrow">GRAPH TOOLS / EXECUTION REPORT</div>
        <h1>Graph transformation history</h1>
        <p>Input graph, production rules and execution snapshots. All steps in one place.</p>
    </header>
    <nav aria-label="Execution steps"></nav>
    <main></main>
    <script type="application/json" id="report-data">__REPORT_DATA__</script>
    <script>
        "use strict";

        const steps = JSON.parse(document.getElementById("report-data").textContent);
        if (steps.length === 1 && steps[0].title === "Result graph") {
            document.title = "Graph visualization";
            document.querySelector("h1").textContent = "Graph visualization";
            document.querySelector("header p").textContent = "Graph and adjacency matrix";
            document.querySelector(".eyebrow").textContent = "GRAPH TOOLS / GRAPH REPORT";
        }
        const svgNamespace = "http://www.w3.org/2000/svg";
        let graphNumber = 0;

        /** Build DOM nodes without interpreting labels as HTML. */
        function element(tag, text, className) {
            const node = document.createElement(tag);
            if (text !== undefined) node.textContent = text;
            if (className) node.className = className;
            return node;
        }

        function svgElement(tag, attributes = {}, text) {
            const node = document.createElementNS(svgNamespace, tag);
            for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function vertexName(vertex) {
            return `${vertex.label || "(no label)"} (ID: ${vertex.index})`;
        }

        function edgeName(edge) {
            return `weight: ${edge.weight ?? "(no weight)"}, label: ${edge.label || "(no label)"}`;
        }

        function sortedVertices(graph) {
            return [...graph.vertices].sort((a, b) =>
                a.index - b.index || (a.label || "").localeCompare(b.label || "", "en"));
        }

        /** Index all connections once; opposite directions share cells only in undirected graphs. */
        function adjacencyMatrix(graph, vertices) {
            const pane = element("div", undefined, "matrix-pane");
            pane.append(element("h3", "Adjacency matrix"));
            const scroll = element("div", undefined, "matrix-scroll");
            scroll.tabIndex = 0;
            scroll.setAttribute("role", "region");
            scroll.setAttribute("aria-label", "Scrollable adjacency matrix");
            const table = element("table");
            table.setAttribute("aria-label", "Adjacency matrix: rows are sources, columns are targets");
            const head = element("thead");
            const headings = element("tr");
            headings.append(element("th", "Vertex"));
            for (const vertex of vertices) {
                const heading = element("th", vertexName(vertex));
                heading.scope = "col";
                headings.append(heading);
            }
            head.append(headings);
            const connections = new Map();
            function add(from, to, edge) {
                const key = `${from}:${to}`;
                if (!connections.has(key)) connections.set(key, []);
                connections.get(key).push(edge);
            }
            for (const edge of graph.edges) {
                add(edge.u, edge.v, edge);
                if (!graph.directed && edge.u !== edge.v) add(edge.v, edge.u, edge);
            }
            const body = element("tbody");
            for (const source of vertices) {
                const row = element("tr");
                const heading = element("th", vertexName(source));
                heading.scope = "row";
                row.append(heading);
                for (const target of vertices) {
                    const edges = connections.get(`${source.index}:${target.index}`) || [];
                    const cell = element("td", edges.length ? undefined : "—", edges.length ? "" : "empty");
                    for (const edge of edges) cell.append(element("div", edgeName(edge), "connection"));
                    row.append(cell);
                }
                body.append(row);
            }
            table.append(head, body);
            scroll.append(table);
            pane.append(scroll, element("p", "Rows: source · Columns: target · —: no edge", "hint"));
            return pane;
        }

        /** Draw a graph in grid or circular coordinates and allow panning. */
        function graphDrawing(graph, vertices, title) {
            const pane = element("div", undefined, "graph-pane");
            pane.append(element("h3", "Graph"));
            const frame = element("div", undefined, "graph-frame");
            const size = Math.max(800, vertices.length * 56);
            const center = size / 2;
            const margin = size * 0.12;
            const plotSize = size - 2 * margin;
            const coordinateVertices = vertices.filter(v => Number.isFinite(v.x) && Number.isFinite(v.y));
            const hasCoordinates = coordinateVertices.length > 0;
            const minX = hasCoordinates ? Math.min(...coordinateVertices.map(v => v.x)) : 0;
            const maxX = hasCoordinates ? Math.max(...coordinateVertices.map(v => v.x)) : 1;
            const minY = hasCoordinates ? Math.min(...coordinateVertices.map(v => v.y)) : 0;
            const maxY = hasCoordinates ? Math.max(...coordinateVertices.map(v => v.y)) : 1;
            const rangeX = maxX - minX || 1;
            const rangeY = maxY - minY || 1;
            const gridPositions = new Map();
            const missing = vertices.filter(v => !Number.isFinite(v.x) || !Number.isFinite(v.y));
            const columns = Math.max(1, Math.ceil(Math.sqrt(missing.length)));
            const rows = Math.max(1, Math.ceil(missing.length / columns));
            missing.forEach((vertex, i) => gridPositions.set(vertex.index, {
                x: margin + ((i % columns + 0.5) / columns) * plotSize,
                y: margin + (Math.floor(i / columns) + 0.5) / rows * plotSize
            }));
            for (const vertex of coordinateVertices) {
                gridPositions.set(vertex.index, {
                    x: margin + (vertex.x - minX) / rangeX * plotSize,
                    y: size - margin - (vertex.y - minY) / rangeY * plotSize
                });
            }
            const circleRadius = vertices.length > 1 ? size * 0.34 : 0;
            const circlePositions = new Map(vertices.map((v, i) => {
                const angle = -Math.PI / 2 + 2 * Math.PI * i / Math.max(1, vertices.length);
                return [v.index, {x: center + circleRadius * Math.cos(angle), y: center + circleRadius * Math.sin(angle)}];
            }));
            let layout = "grid";
            let positions = gridPositions;
            let zoom = 1;
            let panX = 0;
            let panY = 0;

            const svg = svgElement("svg", {viewBox: `0 0 ${size} ${size}`, role: "img", "aria-label": title});
            svg.append(svgElement("title", {}, title));
            const markerId = `arrow-${graphNumber++}`;
            const defs = svgElement("defs");
            const marker = svgElement("marker", {id: markerId, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse"});
            marker.append(svgElement("path", {d: "M 0 0 L 10 5 L 0 10 z", fill: "#7692ac"}));
            defs.append(marker);
            svg.append(defs);

            const layer = svgElement("g", {class: "graph-layer"});
            const grid = svgElement("g", {class: "coordinate-grid"});
            for (let i = 0; i <= 5; i++) {
                const x = margin + plotSize * i / 5;
                const y = margin + plotSize * i / 5;
                grid.append(svgElement("line", {x1: x, y1: margin, x2: x, y2: size - margin, class: i === 0 ? "grid-axis" : "grid-line"}));
                grid.append(svgElement("line", {x1: margin, y1: y, x2: size - margin, y2: y, class: i === 5 ? "grid-axis" : "grid-line"}));
                if (hasCoordinates) {
                    grid.append(svgElement("text", {x, y: size - margin + 24, class: "grid-tick", "text-anchor": "middle"}, (minX + rangeX * i / 5).toPrecision(3)));
                    grid.append(svgElement("text", {x: margin - 12, y: size - margin - plotSize * i / 5 + 4, class: "grid-tick", "text-anchor": "end"}, (minY + rangeY * i / 5).toPrecision(3)));
                }
            }
            grid.append(svgElement("text", {x: size / 2, y: size - 18, class: "grid-tick", "text-anchor": "middle"}, hasCoordinates ? "x" : "Grid columns"));
            grid.append(svgElement("text", {x: 20, y: size / 2, class: "grid-tick", "text-anchor": "middle", transform: `rotate(-90 20 ${size / 2})`}, hasCoordinates ? "y" : "Grid rows"));

            const edgeGroups = new Map();
            for (const edge of graph.edges) {
                const key = `${Math.min(edge.u, edge.v)}:${Math.max(edge.u, edge.v)}`;
                if (!edgeGroups.has(key)) edgeGroups.set(key, []);
                edgeGroups.get(key).push(edge);
            }
            function drawContents() {
                layer.replaceChildren();
                if (layout === "grid") layer.append(grid);
                for (const edges of edgeGroups.values()) edges.forEach((edge, index) => {
                    const from = positions.get(edge.u), to = positions.get(edge.v);
                    if (!from || !to) throw new Error("Edge references a missing vertex");
                    let path, labelX, labelY;
                    if (edge.u === edge.v) {
                        const h = 75 + index * 35;
                        path = `M ${from.x - 20} ${from.y - 19} C ${from.x - h} ${from.y - h * 1.6}, ${from.x + h} ${from.y - h * 1.6}, ${from.x + 20} ${from.y - 19}`;
                        labelX = from.x; labelY = from.y - h * 1.2 - 10;
                    } else {
                        const dx = to.x - from.x, dy = to.y - from.y;
                        const length = Math.hypot(dx, dy) || 1;
                        const bend = (index - (edges.length - 1) / 2) * 65 * (edge.u < edge.v ? 1 : -1);
                        const cx = (from.x + to.x) / 2 - dy / length * bend;
                        const cy = (from.y + to.y) / 2 + dx / length * bend;
                        const startLength = Math.hypot(cx - from.x, cy - from.y) || 1;
                        const endLength = Math.hypot(to.x - cx, to.y - cy) || 1;
                        const sx = from.x + (cx - from.x) / startLength * 29;
                        const sy = from.y + (cy - from.y) / startLength * 29;
                        const ex = to.x - (to.x - cx) / endLength * 31;
                        const ey = to.y - (to.y - cy) / endLength * 31;
                        path = `M ${sx} ${sy} Q ${cx} ${cy} ${ex} ${ey}`;
                        labelX = (sx + 2 * cx + ex) / 4;
                        labelY = (sy + 2 * cy + ey) / 4 - 9;
                    }
                    const curve = svgElement("path", {d: path, class: "edge"});
                    if (graph.directed) curve.setAttribute("marker-end", `url(#${markerId})`);
                    curve.append(svgElement("title", {}, `${edge.u} → ${edge.v}: ${edgeName(edge)}`));
                    const label = svgElement("text", {x: labelX, y: labelY, class: "edge-label"});
                    label.append(svgElement("tspan", {x: labelX}, edge.label || "(no label)"));
                    label.append(svgElement("tspan", {x: labelX, dy: 13}, `w: ${edge.weight ?? "—"}`));
                    layer.append(curve, label);
                });
                for (const vertex of vertices) {
                    const point = positions.get(vertex.index);
                    const group = svgElement("g");
                    group.append(svgElement("title", {}, vertexName(vertex)));
                    group.append(svgElement("circle", {cx: point.x, cy: point.y, r: 28, class: "node"}));
                    group.append(svgElement("text", {x: point.x, y: point.y + 4, class: "node-label"}, vertex.label || "(no label)"));
                    group.append(svgElement("text", {x: point.x, y: point.y + 47, class: "node-id"}, `ID: ${vertex.index}`));
                    layer.append(group);
                }
            }
            drawContents();
            if (!vertices.length) layer.append(svgElement("text", {x: center, y: center, class: "node-id"}, "Empty graph"));
            svg.append(layer);

            function updateView() {
                const extent = size / zoom;
                const originX = center - extent / 2 - panX / zoom;
                const originY = center - extent / 2 - panY / zoom;
                svg.setAttribute("viewBox", `${originX} ${originY} ${extent} ${extent}`);
            }
            function setLayout(next) {
                layout = next;
                positions = layout === "grid" ? gridPositions : circlePositions;
                drawContents();
                for (const button of layoutButtons) button.setAttribute("aria-pressed", String(button.dataset.layout === layout));
            }

            const toolbar = element("div", undefined, "toolbar");
            const layoutButtons = [];
            for (const name of ["grid", "circle"]) {
                const button = element("button", name === "grid" ? "Grid" : "Circle");
                button.type = "button";
                button.dataset.layout = name;
                button.setAttribute("aria-pressed", String(name === layout));
                button.addEventListener("click", () => setLayout(name));
                layoutButtons.push(button);
                toolbar.append(button);
            }
            for (const [text, description, action] of [
                ["+", "Zoom in", () => { zoom = Math.min(4, zoom * 1.25); }],
                ["−", "Zoom out", () => { zoom = Math.max(0.4, zoom / 1.25); }],
                ["Reset", "Reset graph view", () => { zoom = 1; panX = 0; panY = 0; }]
            ]) {
                const button = element("button", text);
                button.type = "button";
                button.setAttribute("aria-label", description);
                button.addEventListener("click", () => { action(); updateView(); });
                toolbar.append(button);
            }

            let drag = null;
            svg.addEventListener("pointerdown", event => {
                if (event.target.closest(".node")) return;
                drag = {x: event.clientX, y: event.clientY, panX, panY};
                svg.setPointerCapture(event.pointerId);
                svg.classList.add("dragging");
            });
            svg.addEventListener("pointermove", event => {
                if (!drag) return;
                panX = drag.panX + event.clientX - drag.x;
                panY = drag.panY + event.clientY - drag.y;
                updateView();
            });
            function endDrag() {
                drag = null;
                svg.classList.remove("dragging");
            }
            svg.addEventListener("pointerup", endDrag);
            svg.addEventListener("pointercancel", endDrag);
            frame.append(svg, toolbar);
            pane.append(frame, element("p", `${vertices.length} vertices · ${graph.edges.length} edges · ${graph.directed ? "Directed" : "Undirected"}`, "hint"));
            return pane;
        }

        function graphView(graph, title) {
            const vertices = sortedVertices(graph);
            const view = element("div", undefined, "graph-view");
            const matrixDetails = element("details", undefined, "matrix-details");
            matrixDetails.append(element("summary", "Adjacency matrix"));
            matrixDetails.append(adjacencyMatrix(graph, vertices));
            view.append(graphDrawing(graph, vertices, title), matrixDetails);
            return view;
        }

        function productionDetails(production) {
            const details = element("details", undefined, "applied-production");
            details.append(element("summary", `Applied production: ${production.name}`));
            if (production.description) details.append(element("p", production.description));
            const sides = element("div", undefined, "production-sides");
            for (const [heading, graph] of [["Left side", production.left], ["Right side", production.right]]) {
                const side = element("section");
                side.append(element("h4", heading), graphView(graph, `${production.name}: ${heading}`));
                sides.append(side);
            }
            const rules = element("div", undefined, "rules");
            const mappings = production.mappings ?? production.mapping ?? [];
            const embeddings = production.embeddings ?? production.embedding ?? [];
            for (const [heading, descriptions] of [
                ["Mappings", mappings.map(mapping => `${mapping.left} → ${mapping.right}`)],
                ["Embeddings", embeddings.map(embedding =>
                    `Left ${embedding.leftVertex} · neighbor: ${embedding.neighborLabel} · connect to: ${embedding.connectTo.join(", ") || "(none)"}`)]
            ]) {
                const section = element("section");
                section.append(element("h4", heading));
                const list = element("ul");
                for (const text of descriptions.length ? descriptions : ["None"]) list.append(element("li", text));
                section.append(list);
                rules.append(section);
            }
            details.append(element("p", "Rules shown as defined in the source grammar. Mapping and embedding precedence follows the selected execution mode.", "hint"));
            details.append(sides, rules);
            return details;
        }

        const navigation = document.querySelector("nav");
        const main = document.querySelector("main");
        steps.forEach((step, index) => {
            const link = element("a", step.title);
            link.href = `#step-${index}`;
            navigation.append(link);
            const card = element("section", undefined, "step");
            card.id = `step-${index}`;
            const heading = element("div", undefined, "step-heading");
            heading.append(element("span", String(index).padStart(2, "0"), "number"), element("h2", step.title));
            card.append(heading, graphView(step.graph, step.title));
            if (step.production) card.append(productionDetails(step.production));
            main.append(card);
        });
    </script>
</body>
</html>
